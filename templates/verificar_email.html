<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuintoDia - Verificação de Email</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" type="imagex/ico" href="{{ url_for('static', filename='img/iconavegador.ico') }}">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .wrapper {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .login-form {
      width: 100%;
    }
    .login-form h2 {
      margin-bottom: 20px;
      color: #333;
    }
    .login-form input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .login-form .btn-green {
      width: 100%;
      padding: 10px;
      background-color: #28a745;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    .login-form .btn-green:hover {
      background-color: #218838;
    }
    .flash-message {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 4px;
      text-align: center;
    }
    .flash-message.error {
      background-color: #f8d7da;
      color: #721c24;
    }
    .flash-message.success {
      background-color: #d4edda;
      color: #155724;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <form class="login-form" method="POST" action="{{ url_for('verificar_email') }}">
        <h2>Verificação de Email</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash-message {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <input type="text" name="verification_code" placeholder="Código de Verificação" required>
        <button type="submit" class="btn-green">Verificar</button>
      </form>
    </div>
  </div>
</body>
</html>
